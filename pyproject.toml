[project]
name = "reminder"
version = "0.1.0"
description = "A program to remind users of their schedules"
authors = [
    {name = "Sitso"}
]
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "django (<6.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "mysqlclient (>=2.2.7,<3.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "djoser (>=2.3.3,<3.0.0)",
    "drf-nested-routers (>=0.95.0,<0.96.0)",
    "celery (>=5.6.0,<6.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
